<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Classroom Finder - Search Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Search Room Page -->

    <div class="dashboard-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🏫</div>
                <div>
                    <h3>Classroom Finder</h3>
                    <p>Dept. of CSE</p>
                </div>
                <button class="hamburger-btn" onclick="document.querySelector('.sidebar').classList.toggle('menu-open')">☰</button>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><span class="menu-icon">🏠</span> Dashboard</a>
                <a href="search.html" class="menu-item active"><span class="menu-icon">🔍</span> Search Room</a>
                <a href="routine.html" class="menu-item"><span class="menu-icon">📅</span> Full Routine</a>
                <a href="bookings.html" class="menu-item"><span class="menu-icon">📋</span> My Bookings</a>
                <a href="admin.html" class="menu-item"><span class="menu-icon">⚙️</span> Admin Panel</a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="menu-item logout"><span class="menu-icon">🚪</span> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Search Room</h1>
                    <p class="topbar-subtitle">Check if a room is free at a specific time</p>
                </div>
                <div class="topbar-actions">
                    <button class="notification-btn">🔔</button>
                    <div class="user-badge">
                        <div class="user-avatar">R</div>
                        <span>Student</span>
                    </div>
                </div>
            </header>

            <!-- Search Form -->
            <section class="search-box">
                <div class="search-field">
                    <label>Room</label>
                    <select id="roomSelect">
                        <option value="">All Rooms</option>
                        <option value="101">Room 101</option>
                        <option value="102">Room 102</option>
                        <option value="103">Room 103</option>
                        <option value="104">Room 104</option>
                        <option value="201">Room 201</option>
                        <option value="202">Room 202</option>
                        <option value="203">Room 203</option>
                    </select>
                </div>

                <div class="search-field">
                    <label>Day</label>
                    <select id="daySelect">
                        <option value="">Select Day</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                    </select>
                </div>

                <div class="search-field">
                    <label>Time</label>
                    <input type="time" id="timeSelect">
                </div>

                <button class="search-btn" id="searchBtn">🔍 Search</button>
            </section>

            <!-- Results Summary + Filter Chips -->
            <div class="results-header">
                <h3 class="results-title">Room Status</h3>
                <div class="filter-chips">
                    <button class="filter-chip active">All</button>
                    <button class="filter-chip">Free Only</button>
                    <button class="filter-chip">Booked Only</button>
                </div>
            </div>

            <!-- Results -->
            <section class="room-grid" id="resultsGrid">
                <!-- Room cards will be generated here by JavaScript -->
            </section>

            <!-- Booking Modal -->
            <div class="modal-overlay" id="bookingModal" style="display:none;">
                <div class="modal-box">
                    <div class="modal-header">
                        <h3>Book Room <span id="modalRoomNumber"></span></h3>
                        <button class="modal-close" id="modalCloseBtn">✕</button>
                    </div>

                    <p id="modalError" class="modal-error" style="display:none;"></p>

                    <div class="input-group">
                        <label>Purpose</label>
                        <select id="bookingPurpose">
                            <option value="Extra Class">Extra Class</option>
                            <option value="Class Test">Class Test</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="bookingDate">
                    </div>

                    <div class="modal-time-row">
                        <div class="input-group">
                            <label>Start Time</label>
                            <input type="time" id="bookingStartTime">
                        </div>
                        <div class="input-group">
                            <label>End Time</label>
                            <input type="time" id="bookingEndTime">
                        </div>
                    </div>

                    <button class="login-btn" id="confirmBookingBtn">Confirm Booking</button>
                </div>
            </div>

        </main>

    </div>

    <script type="module" src="js/session.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Classroom Finder - Full Routine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full Routine Page -->

  <div class="dashboard-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🏫</div>
        <div>
          <h3>Classroom Finder</h3>
          <p>Dept. of CSE</p>
        </div>
        <button class="hamburger-btn" onclick="document.querySelector('.sidebar').classList.toggle('menu-open')">☰</button>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <span class="menu-icon">🏠</span> Dashboard
        </a>
        <a href="search.html" class="menu-item">
          <span class="menu-icon">🔍</span> Search Room
        </a>
        <a href="routine.html" class="menu-item active">
          <span class="menu-icon">📅</span> Full Routine
        </a>
        <a href="bookings.html" class="menu-item">
          <span class="menu-icon">📋</span> My Bookings
        </a>
        <a href="admin.html" class="menu-item">
          <span class="menu-icon">⚙️</span> Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" class="menu-item logout">
          <span class="menu-icon">🚪</span> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Full Routine</h1>
          <p class="topbar-subtitle">Complete department class schedule</p>
        </div>
        <div class="topbar-actions">
          <button class="notification-btn">🔔</button>
          <div class="user-badge">
            <div class="user-avatar">R</div>
            <span>Student</span>
          </div>
        </div>
      </header>

      <!-- Day Tabs -->
        <div class="day-tabs" id="dayTabs">
          <button class="day-tab active" data-day="">All Days</button>
          <button class="day-tab" data-day="Saturday">Saturday</button>
          <button class="day-tab" data-day="Sunday">Sunday</button>
          <button class="day-tab" data-day="Monday">Monday</button>
          <button class="day-tab" data-day="Tuesday">Tuesday</button>
          <button class="day-tab" data-day="Wednesday">Wednesday</button>
          <button class="day-tab" data-day="Thursday">Thursday</button>
        </div>

      <!-- Filter -->
      <section class="filter-box">
        <div class="search-field">
          <label>Filter by Room</label>
          <select id="filterRoom">
            <option value="">All Rooms</option>
            <!-- Options loaded dynamically from the rooms collection -->
          </select>
        </div>
      </section>

      <!-- Routine Table -->
      <section class="table-wrapper">
        <table class="routine-table">
          <thead>
            <tr>
              <th>Day</th>
              <th>Time</th>
              <th>Room</th>
              <th>Subject</th>
              <th>Teacher</th>
            </tr>
          </thead>
          <tbody id="routineBody">
            <!-- Rows will be generated by JavaScript -->
          </tbody>
        </table>
      </section>

    </main>

  </div>

  <script type="module" src="js/session.js"></script>
  <script type="module" src="js/main.js"></script>
  
</body>
</html>
